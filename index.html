<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Идеальная куртка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-first; a sticky "fitting room" stage with the illustrated figure, then numbered question cards; two columns on wide screens */
:root {
  --bg: #FFF4F7;
  --surface: #FFFFFF;
  --ink: #2B1631;
  --muted: #7C6383;
  --line: #F1D8E2;
  --accent: #EE3D6B;      /* raspberry */
  --accent-2: #FF8A4C;    /* tangerine, used in gradients */
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE3EB;
  --sun: #FFC13B;
  --stage-a: #FFD6E2;
  --stage-b: #FFE7C2;
  --stage-c: #E9DDFF;
  --shadow: 0 10px 30px rgba(150, 40, 80, .12);
  --font-display: "Unbounded", "Trebuchet MS", Verdana, sans-serif;
  --font-body: "Nunito", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1020; --surface: #261830; --ink: #FAEAF1; --muted: #C3A8C8; --line: #3E2A49;
    --accent: #FF6F94; --accent-2: #FFA06A; --accent-ink: #26101B; --accent-soft: #4A2238; --sun: #FFCB5E;
    --stage-a: #4A2140; --stage-b: #46302A; --stage-c: #2F2752; --shadow: 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1020; --surface: #261830; --ink: #FAEAF1; --muted: #C3A8C8; --line: #3E2A49;
  --accent: #FF6F94; --accent-2: #FFA06A; --accent-ink: #26101B; --accent-soft: #4A2238; --sun: #FFCB5E;
  --stage-a: #4A2140; --stage-b: #46302A; --stage-c: #2F2752; --shadow: 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 56px;
}
header { margin-bottom: 16px; }
.eyebrow { display: inline-block; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
header h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 8.5vw, 54px);
  line-height: 1.05; margin: 0 0 10px; letter-spacing: -.02em; text-wrap: balance;
}
header h1 em {
  font-style: normal;
  background: linear-gradient(transparent 62%, var(--sun) 62%, var(--sun) 92%, transparent 92%);
}
header p { margin: 0; color: var(--muted); max-width: 56ch; font-size: 16px; }
.banner { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 15px; font-weight: 600; }
.layout { display: grid; gap: 16px; }
@media (min-width: 880px) { .layout { grid-template-columns: 340px minmax(0, 1fr); align-items: start; gap: 28px; } }

/* Stage */
.stage {
  position: relative; z-index: 5;
  border-radius: var(--r);
  background:
    radial-gradient(circle at 18% 30%, var(--stage-a) 0 42%, transparent 62%),
    radial-gradient(circle at 85% 80%, var(--stage-b) 0 35%, transparent 60%),
    var(--stage-c);
  box-shadow: var(--shadow);
  padding: 8px 14px 10px 8px;
  display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px; align-items: center;
}
.stage svg { width: 116px; height: 232px; display: block; }
.stage .info { min-width: 0; }
.stage .kind { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }
.tags li { background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.dots { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--surface); }
.meter { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); }
.meter .bar { height: 6px; background: var(--surface); border-radius: 6px; margin-top: 4px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
@media (min-width: 880px) {
  .stage { position: sticky; top: 22px; border-radius: var(--r); margin: 0; grid-template-columns: 1fr; justify-items: center; padding: 18px 20px 22px; }
  .stage svg { width: 230px; height: 460px; }
  .stage .info { width: 100%; }
  .stage .kind { font-size: 24px; text-align: center; }
  .tags, .dots { justify-content: center; }
}

/* Questions */
form { display: grid; gap: 14px; counter-reset: q; }
fieldset {
  border: 0; margin: 0; background: var(--surface); border-radius: var(--r);
  padding: 18px 16px; min-width: 0; box-shadow: 0 2px 0 var(--line);
}
legend { float: left; width: 100%; padding: 0; margin: 0 0 4px; display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.25; }
legend::before {
  counter-increment: q; content: counter(q);
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; font-weight: 800; color: var(--accent-ink);
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
legend + * { clear: both; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-weight: 700; font-size: 14.5px; color: var(--ink); background: var(--bg);
  border: 2px solid transparent; border-radius: 999px; padding: 8px 15px; min-height: 42px; cursor: pointer;
  transition: transform .15s, background .15s, color .15s;
}
.chip:hover { border-color: var(--line); }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); animation: pop .25s; }
@keyframes pop { 50% { transform: scale(1.06); } }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  font: inherit; text-align: left; color: var(--ink); background: var(--bg); cursor: pointer;
  border: 2px solid transparent; border-radius: 18px; padding: 8px 10px 10px; min-width: 0;
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center;
  transition: transform .15s, border-color .15s;
}
.card svg { width: 44px; height: 88px; }
.card b { display: block; font-weight: 800; font-size: 14px; line-height: 1.2; margin-bottom: 2px; }
.card small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.card:hover { transform: translateY(-2px); }
.card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); animation: pop .25s; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 8px; }
.tile {
  font: inherit; font-weight: 700; font-size: 13px; line-height: 1.2; color: var(--ink); text-align: center; cursor: pointer;
  background: none; border: 0; padding: 0; display: grid; gap: 6px; justify-items: stretch; align-content: start; min-width: 0;
}
.tile .pic {
  display: grid; place-items: center; height: 96px; border-radius: 16px; overflow: hidden;
  background: linear-gradient(160deg, var(--stage-a), var(--stage-b)); border: 2px solid transparent; transition: transform .15s, border-color .15s;
}
.tile .pic svg { height: 100%; width: 100%; display: block; }
.tile .pic svg.icon { width: 64%; height: 64%; }
.tile:hover .pic { transform: translateY(-2px); }
.tile[aria-pressed="true"] .pic { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tile[aria-pressed="true"] { color: var(--accent); }
.tile[aria-disabled="true"] { opacity: .35; text-decoration: line-through; }
.colors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px; }
@media (min-width: 620px) { .colors { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.sw { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  display: grid; justify-items: center; gap: 5px; font-size: 12px; font-weight: 700; line-height: 1.2; text-align: center; }
.sw span { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  box-shadow: inset 0 -6px 10px rgba(0,0,0,.18), inset 0 4px 8px rgba(255,255,255,.35); transition: transform .15s; }
.sw:hover span { transform: scale(1.08); }
.sw[aria-pressed="true"] span { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
.sw[aria-pressed="true"] span::after { content: "✓"; color: #fff; font-weight: 800; font-size: 18px; text-shadow: 0 0 4px rgba(0,0,0,.6); }
.sub { margin-top: 16px; }
.sub-title { font-weight: 800; font-size: 15px; margin: 0 0 8px; }
label.field { display: grid; gap: 6px; font-weight: 800; font-size: 15px; }
label.field + label.field { margin-top: 14px; }
textarea {
  font: inherit; font-weight: 400; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; resize: vertical; min-height: 64px;
}
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* Result */
.result {
  border-radius: var(--r); padding: 20px 16px; color: var(--ink); box-shadow: var(--shadow);
  background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--accent), var(--sun)) border-box;
  border: 3px solid transparent;
}
.result h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.15; margin: 0 0 12px; }
.result pre {
  font-family: var(--font-body); white-space: pre-wrap; word-break: break-word; margin: 0 0 16px;
  background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 15px; user-select: text;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit; font-weight: 800; font-size: 16px; border-radius: 999px; padding: 12px 22px; min-height: 50px; cursor: pointer;
  border: 2px solid transparent; color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 18px rgba(238, 61, 107, .3);
}
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); box-shadow: none; }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); box-shadow: none; }
.status { min-height: 1.5em; font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 10px; }
.chip[aria-disabled="true"], .sw[aria-disabled="true"] { opacity: .35; }
.chip[aria-disabled="true"] { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.chip[aria-disabled="true"]:hover { border-color: transparent; }
.chip[data-auto] { background: var(--accent-soft); color: var(--ink); border: 2px dashed var(--accent); }
.tile[data-auto] .pic { border-style: dashed; box-shadow: none; }
.tile[data-auto] { color: var(--ink); }
.card[data-auto] { border-style: dashed; }
.done {
  font: inherit; font-weight: 800; font-size: 14px; color: var(--accent-ink); cursor: pointer; border: 0;
  border-radius: 999px; padding: 8px 16px; min-height: 40px; margin-top: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.mini {
  position: fixed; z-index: 15; top: 0; left: 0; right: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--stage-a), var(--stage-b)); box-shadow: var(--shadow);
  border-radius: 0 0 18px 18px;
}
.mini-in { display: flex; align-items: center; gap: 10px; max-width: 1100px; margin: 0 auto; padding-block: 4px; }
.mini svg { width: 46px; height: 94px; flex: none; }
.mini-info { min-width: 0; flex: 1; }
.mini-kind { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.2; }
.mini-meter { margin: 2px 0 0; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.mini .done { margin-top: 0; flex: none; }
fieldset, .result { scroll-margin-top: 112px; }
.toast {
  position: fixed; z-index: 20; left: 0; right: 0; margin: 0 auto; width: min(520px, calc(100% - 32px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px;
  font-weight: 700; font-size: 15px; line-height: 1.4; box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Осень · Зима</span>
    <h1>Моя <em>идеальная</em> куртка</h1>
    <p>Выбирай, что нравится, рисунок меняется сразу. Любой вопрос можно пропустить.</p>
  </header>
  <div class="banner" id="sharedBanner" hidden>Это выбор, которым поделились по ссылке. Его можно посмотреть и изменить.</div>

  <div class="layout">
    <aside class="stage" aria-live="polite">
      <svg id="art" viewBox="0 6 200 380" role="img" aria-label="Рисунок выбранной куртки"></svg>
      <div class="info">
        <p class="kind" id="kind">Куртка</p>
        <ul class="tags" id="tags"></ul>
        <div class="dots" id="dots"></div>
        <div class="meter"><span id="meterText"></span><div class="bar"><i id="meterBar"></i></div></div>
        <button class="done" type="button" data-done>Готово</button>
      </div>
    </aside>

    <div style="display:grid; gap:14px; min-width:0">
      <form id="form" autocomplete="off"></form>
      <section class="result">
        <h2>Что получилось</h2>
        <pre id="summary"></pre>
        <div class="actions">
          <button class="btn" type="button" id="shareBtn">Отправить</button>
          <button class="btn ghost" type="button" id="copyBtn">Скопировать текст</button>
          <button class="btn quiet" type="button" id="resetBtn">Начать заново</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="mini" id="mini" hidden>
  <div class="mini-in">
    <svg id="miniArt" viewBox="20 34 160 338" aria-hidden="true"></svg>
    <div class="mini-info"><p class="mini-kind" id="miniKind"></p><p class="mini-meter" id="miniMeter"></p></div>
    <button class="done" type="button" data-done>Готово</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- Questionnaire definition ----------
  const SECTIONS = [
    { id: "type", title: "Какая куртка", hint: "Выбери один тип. Остальные вопросы заполнятся типичными вариантами (пунктирная рамка), их можно поменять. Сплошная рамка значит твой выбор.", kind: "single", cards: true, options: [
      ["pufS", "Пуховик короткий", "дутый, до бедра, очень тёплый"],
      ["pufL", "Пуховик длинный", "пуховое пальто до колена и ниже"],
      ["parka", "Парка", "удлинённая, с капюшоном, часто с мехом"],
      ["coat", "Пальто", "классика из шерсти, до колена"],
      ["hcoat", "Полупальто", "укороченное пальто"],
      ["trench", "Тренч", "плащ с поясом, для тёплой осени"],
      ["quilt", "Стёганая куртка", "тонкая и лёгкая, со стёжкой"],
      ["leather", "Косуха", "кожаная, короткая, с косой молнией"],
      ["bomber", "Бомбер", "с трикотажными манжетами и низом"],
      ["sheep", "Дублёнка", "из овчины, мехом внутрь"],
      ["fur", "Шуба, экомех", "в том числе плюшевая «тедди»"],
      ["wind", "Ветровка, анорак", "лёгкая, от ветра и дождя"],
      ["denim", "Джинсовая куртка", "деним, бывает утеплённая"],
      ["shacket", "Куртка-рубашка", "шакет, плотная, часто в клетку"],
      ["cape", "Кейп, пончо", "накидка без рукавов"],
    ]},
    { id: "length", title: "Длина", kind: "single", options: [
      ["waist", "До талии"], ["hip", "До бедра"], ["mid", "До середины бедра"], ["knee", "До колена"], ["below", "Ниже колена"],
    ]},
    { id: "fit", title: "Силуэт", kind: "single", options: [
      ["fitted", "Приталенный"], ["straight", "Прямой"], ["over", "Оверсайз"], ["belt", "С поясом"],
    ]},
    { id: "insul", title: "Утеплитель", hint: "Можно несколько.", kind: "multi", options: [
      ["down", "Натуральный пух"], ["synth", "Синтетика"], ["wool", "Шерсть"], ["furIns", "Мех, овчина"], ["none", "Без утеплителя"],
    ]},
    { id: "temp", title: "Насколько тёплая", kind: "single", options: [
      ["p5", "До +5 °C"], ["0", "До 0 °C"], ["m10", "До −10 °C"], ["m20", "До −20 °C"],
    ]},
    { id: "hood", title: "Капюшон и мех", kind: "single", options: [
      ["no", "Без капюшона"], ["fixed", "Несъёмный"], ["detach", "Съёмный"],
    ], sub: { id: "fur", title: "Мех на капюшоне или воротнике", options: [
      ["no", "Без меха"], ["faux", "Искусственный"], ["real", "Натуральный"],
    ]}},
    { id: "collar", title: "Воротник", kind: "single", options: [
      ["stand", "Стойка"], ["turn", "Отложной"], ["eng", "С лацканами"], ["none", "Без воротника"],
    ]},
    { id: "closure", title: "Застёжка", kind: "single", options: [
      ["zip", "Молния"], ["snap", "Кнопки"], ["btn", "Пуговицы"], ["dbl", "Двубортная"], ["wrap", "На запах"],
    ]},
    { id: "protect", title: "Защита от погоды", hint: "Можно несколько.", kind: "multi", options: [
      ["water", "Не промокает"], ["wind", "Не продувается"], ["any", "Не важно"],
    ]},
    { id: "material", title: "Материал верха", hint: "Можно несколько. На рисунке будет первый.", kind: "multi", options: [
      ["nylon", "Нейлон, плащёвка"], ["cotton", "Хлопок, габардин"], ["wool", "Шерсть"], ["leather", "Кожа"], ["eco", "Экокожа"], ["suede", "Замша"], ["denim", "Деним"], ["furM", "Мех, экомех"],
    ]},
    { id: "colors", title: "Цвет", hint: "Отметь все, что нравятся. На рисунке будет первый.", kind: "colors", options: [
      ["black", "Чёрный", "#1F1F24"], ["graph", "Графит", "#4A4F59"], ["grey", "Серый", "#A2A5AD"], ["milk", "Молочный", "#F0EBE1"],
      ["beige", "Бежевый", "#D9C3A0"], ["camel", "Кэмел", "#BC8858"], ["brown", "Шоколад", "#6A4631"], ["khaki", "Хаки", "#7A7B4C"],
      ["green", "Изумрудный", "#1F6B57"], ["navy", "Тёмно-синий", "#263759"], ["blue", "Голубой", "#93BCE0"], ["burg", "Бордовый", "#7A2338"],
      ["red", "Красный", "#D03A3A"], ["pink", "Пудровый", "#E8AFB5"], ["lav", "Лавандовый", "#B3A4DA"], ["must", "Горчичный", "#D9A332"],
    ], sub: { id: "texture", title: "Узор", options: [
      ["plain", "Однотонный"], ["quilt", "Стёганый"], ["check", "В клетку"],
    ], sub2: { id: "finish", title: "Поверхность", options: [
      ["matte", "Матовая"], ["gloss", "Блестящая"],
    ]}}},
    { id: "details", title: "Детали", hint: "Можно несколько. Внутренние карманы на рисунке не видны.", kind: "multi", options: [
      ["cuffs", "Трикотажные манжеты"], ["pockets", "Много карманов"], ["inner", "Внутренние карманы"], ["waistAdj", "Регулируемая талия"], ["twoZip", "Двусторонняя молния"], ["long", "Удлинённая спинка"],

  const PRESETS = {

  };
  const PRESET_KEYS = ["length", "fit", "insul", "hood", "fur", "collar", "closure", "material", "texture", "finish"];
  const MULTI = new Set(["insul", "protect", "material", "colors", "details", "use", "size"]);

  const LABEL = {}; const COLOR_HEX = {};
  const groups = [];
  SECTIONS.forEach(s => { if (s.options) groups.push(s); if (s.sub) { groups.push(s.sub); if (s.sub.sub2) groups.push(s.sub.sub2); } });
  groups.forEach(g => { LABEL[g.id] = {}; g.options.forEach(o => { LABEL[g.id][o[0]] = o[1]; if (g.id === "colors") COLOR_HEX[o[0]] = o[2]; }); });

  const blank = () => ({ type: "", length: "", fit: "", insul: [], temp: "", hood: "", fur: "", collar: "", closure: "",
    protect: [], material: [], colors: [], texture: "", finish: "", details: [], use: [], size: [], must: "", nogo: "", brands: "", touched: [] });
  let S = blank();

  // ---------- Persistence: shared link first, then this phone's draft ----------
  const b64e = str => { const bytes = new TextEncoder().encode(str); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const b64d = str => { const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
  const compact = () => { const o = {}; Object.keys(S).forEach(k => { if (k === "touched") return; const v = S[k]; if (Array.isArray(v) ? v.length : v) o[k] = v; }); return o; };
  const merge = o => {
    const b = blank();
    if (o && Array.isArray(o.type)) o.type = o.type[o.type.length - 1] || "";   // links from the first version
    Object.keys(b).forEach(k => { if (o && o[k] !== undefined && typeof o[k] === typeof b[k] && Array.isArray(o[k]) === Array.isArray(b[k])) b[k] = o[k]; });
    return b;
  };
  let fromLink = false;
  try { const m = location.hash.match(/^#s=([A-Za-z0-9_-]+)/); if (m) { S = merge(JSON.parse(b64d(m[1]))); fromLink = true; } } catch (e) {}
  if (!fromLink) { try { const raw = localStorage.getItem("jacket-v1"); if (raw) S = merge(JSON.parse(raw)); } catch (e) {} }
  const save = () => { try { localStorage.setItem("jacket-v1", JSON.stringify(S)); } catch (e) {} };
  document.getElementById("sharedBanner").hidden = !fromLink;

  // ---------- Illustration: a petite figure built from simple shapes ----------
  const shade = (hex, f) => {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = f < 0 ? 0 : 255, p = Math.abs(f);
    r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  };
  const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
  const f1 = v => Math.round(v * 10) / 10;
  // Smooth closed path through points; a point with a third value `true` is a sharp corner.
  function smooth(pts) {
    const n = pts.length, P = i => pts[(i + n) % n];
    let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;
    for (let i = 0; i < n; i++) {
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      const c1 = p1[2] ? p1 : [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = p2[2] ? p2 : [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${f1(c1[0])},${f1(c1[1])} ${f1(c2[0])},${f1(c2[1])} ${f1(p2[0])},${f1(p2[1])}`;
    }

  }
  const mirror = pts => pts.map(p => [200 - p[0], p[1], p[2]]);
  // Rounded capsule between two points (sleeves, cuffs)
  function capsule(S, E, w) {
    const dx = E[0] - S[0], dy = E[1] - S[1], len = Math.hypot(dx, dy), r = w / 2;
    const nx = -dy / len * r, ny = dx / len * r;
    return `M${f1(S[0] + nx)},${f1(S[1] + ny)} L${f1(E[0] + nx)},${f1(E[1] + ny)} A${r},${r} 0 0 0 ${f1(E[0] - nx)},${f1(E[1] - ny)} L${f1(S[0] - nx)},${f1(S[1] - ny)} A${r},${r} 0 0 0 ${f1(S[0] + nx)},${f1(S[1] + ny)}Z`;
  }

  const SKIN = "#F7DCCB", HAIR = "#C9A66B", HAIR_HI = "#E3C893", LEGS = "#34395A", BOOT = "#4A302B";
  const LEN_Y = { waist: 206, hip: 236, mid: 262, knee: 296, below: 330 };
  const FIT = { fitted: [32, 25, 31, .14], straight: [33, 31, 33, .07], over: [40, 39, 41, .08], belt: [33, 26, 32, .12] };
  const FIT_PIC = { fitted: [31, 19, 30, .2], straight: [33, 33, 34, .03], over: [46, 46, 48, .1], belt: [33, 20, 32, .16] };
  const CX = 100;

  function illustrate(st, uid, scene, pic) {
    const t = st.type || "";
    const p = PRESETS[t] || {};
    const fit = st.fit || p.fit || "straight";
    const bottom = LEN_Y[st.length || p.length] || 236;
    const isCape = t === "cape", isPuffer = t === "pufS" || t === "pufL";
    const mats = [(st.material && st.material[0]) || (p.material || [])[0]].filter(Boolean), details = st.details || [], insul = st.insul || [];
    const use = st.use || [], protect = st.protect || [], temp = st.temp || "";
    const color = st.colors && st.colors.length ? COLOR_HEX[st.colors[0]] : (p.color || "#EE3D6B");
    const light = lum(color) > .6;
    const edge = shade(color, light ? -.3 : -.45);
    const detailC = light ? shade(color, -.55) : shade(color, .5);
    const rib = shade(color, light ? -.22 : -.3);
    const hardware = "#D9B970";
    const furC = st.fur === "real" ? "#C8AE8C" : "#F3EEE6";
    const hasFur = st.fur === "faux" || st.fur === "real";
    const hood = st.hood === "fixed" || st.hood === "detach";
    const collar = st.collar || "", closure = st.closure || "", texture = st.texture || "", finish = st.finish || "";
    const id = s => `${s}-${uid}`;

    // volume grows with insulation and the coldest temperature
    const pf = Math.max(insul.includes("down") ? 3 : 0, insul.includes("synth") ? 2 : 0, insul.includes("furIns") ? 2 : 0, insul.includes("wool") ? 1 : 0)
      + (isPuffer ? 2 : 0) + (temp === "m20" ? 1 : 0);
    // picture tiles exaggerate silhouette and volume so small differences stay visible
    const W = (pic ? FIT_PIC : FIT)[fit] || FIT.straight;
    const pv = pic ? pf * 2.5 : pf;
    const sh = W[0] + pv, wa = W[1] + pv, hi = W[2] + pv;
    const hem = bottom > 224 ? hi + (bottom - 224) * W[3] : wa + (hi - wa) * (bottom - 196) / 28 - (t === "bomber" ? 2 : 0);

    let body;
    if (isCape) {
      const cw = Math.max(54, hem + 18);
      const half = [[CX - 10, 123, true], [CX - 24, 128], [CX - 40, 160], [CX - cw, bottom, true]];

    } else {

      if (bottom > 226) half.push([CX - hi, 224]);

    }
    const sw = (fit === "over" ? (pic ? 24 : 20) : 16) + pv;
    const SL = [CX - sh + 6, 134], EL = [CX - sh - 6, 228];
    const SR = [200 - SL[0], SL[1]], ER = [200 - EL[0], EL[1]];
    const sleeveL = capsule(SL, EL, sw), sleeveR = capsule(SR, ER, sw);
    const handL = [EL[0] - 1, EL[1] + 8], handR = [ER[0] + 1, ER[1] + 8];

    const o = [];
    o.push(`<defs>
      <clipPath id="${id("c")}"><path d="${body}"/>${isCape ? "" : `<path d="${sleeveL}"/><path d="${sleeveR}"/>`}</clipPath>

      <pattern id="${id("tw")}" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3" stroke="${mats.includes("denim") ? "#fff" : detailC}" stroke-width=".8" stroke-opacity="${mats.includes("denim") ? .28 : .16}"/></pattern>

      if (temp === "p5") P.slice(0, 9).forEach(([x, y], i) => o.push(`<ellipse cx="${x}" cy="${y}" rx="5" ry="2.6" transform="rotate(${i * 47 % 180} ${x} ${y})" fill="${["#F08A3A", "#E2552E", "#F4B53F"][i % 3]}" opacity=".85"/>`));
      if (temp === "0" || protect.includes("water")) P.forEach(([x, y]) => o.push(`<line x1="${x}" y1="${y}" x2="${x - 3}" y2="${y + 10}" stroke="#6FA3DB" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>`));
      if (temp === "m10" || temp === "m20") {

        if (temp === "m20") o.push(`<path d="M0,378 Q50,362 100,370 Q150,360 200,374 L200,400 L0,400 Z" fill="#fff" stroke="#D5E0F0"/>`);
      }
      if (protect.includes("wind")) o.push(`<path d="M8,96 q20,-8 34,0 q8,5 0,9 M156,150 q18,-8 32,0 M150,160 q14,-6 26,0 M10,260 q22,-8 36,0 q8,6 -1,9" stroke="#8DA9D6" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>`);
      if (use.includes("trip")) o.push(`<rect x="148" y="300" width="32" height="64" rx="8" fill="#4F7FD1" stroke="#36599A"/><path d="M157,300 L157,284 L171,284 L171,300" fill="none" stroke="#36599A" stroke-width="2.4" stroke-linejoin="round"/><line x1="148" x2="180" y1="320" y2="320" stroke="#36599A"/><line x1="148" x2="180" y1="344" y2="344" stroke="#36599A"/><circle cx="154" cy="367" r="3" fill="#2B2B33"/><circle cx="174" cy="367" r="3" fill="#2B2B33"/>`);
    }
    o.push(`<ellipse cx="100" cy="370" rx="40" ry="5.5" fill="#000" opacity=".12"/>`);

    // straight hair, back part (falls just past the shoulders)
    if (!hood) o.push(`<rect x="70" y="80" width="60" height="80" rx="12" fill="${HAIR}"/>`);
    // long back hem shows behind the legs
    // jeans and shoes
    o.push(`<rect x="80" y="190" width="40" height="46" rx="12" fill="${LEGS}"/><rect x="85" y="214" width="14" height="140" rx="7" fill="${LEGS}"/><rect x="101" y="214" width="14" height="140" rx="7" fill="${LEGS}"/>`);
    if (use.includes("active")) o.push(`<rect x="79" y="352" width="22" height="14" rx="7" fill="#F7F7FA" stroke="#B7BCCB" stroke-width=".8"/><rect x="99" y="352" width="22" height="14" rx="7" fill="#F7F7FA" stroke="#B7BCCB" stroke-width=".8"/><path d="M80,363 L100,363 M100,363 L120,363" stroke="#EE3D6B" stroke-width="2.2"/>`);
    else o.push(`<rect x="83" y="330" width="18" height="36" rx="7" fill="${BOOT}"/><rect x="99" y="330" width="18" height="36" rx="7" fill="${BOOT}"/>`);

    if (!isCape) o.push(`<circle cx="${f1(handL[0])}" cy="${handL[1]}" r="6" fill="${SKIN}"/><circle cx="${f1(handR[0])}" cy="${handR[1]}" r="6" fill="${SKIN}"/>`);

    // jacket
    o.push(`<g fill="${color}" stroke="${edge}" stroke-width="1.2" stroke-linejoin="round">${isCape ? "" : `<path d="${sleeveL}"/><path d="${sleeveR}"/>`}<path d="${body}"/></g>`);

    const ov = [];
    if (texture === "quilt") {
      if (isPuffer) for (let y = 142; y < bottom + 4; y += 16) ov.push(`<path d="M0,${y - 7} Q100,${y - 2} 200,${y - 7}" stroke="#fff" stroke-opacity=".22" stroke-width="4" fill="none"/><path d="M0,${y} Q100,${y + 5} 200,${y}" stroke="${edge}" stroke-width="1.3" fill="none"/>`);
      else for (let k = -400; k < 400; k += 12) ov.push(`<line x1="${k}" y1="0" x2="${k + 400}" y2="400" stroke="${edge}" stroke-width=".7"/><line x1="${k + 400}" y1="0" x2="${k}" y2="400" stroke="${edge}" stroke-width=".7"/>`);
    }

      for (let x = 2; x < 200; x += 14) ov.push(`<rect x="${x}" y="0" width="5" height="400" fill="${detailC}" opacity=".2"/>`);
      for (let y = 120; y < 400; y += 14) ov.push(`<rect x="0" y="${y}" width="200" height="5" fill="${detailC}" opacity=".2"/>`);
      for (let x = 9; x < 200; x += 14) ov.push(`<line x1="${x}" x2="${x}" y1="0" y2="400" stroke="${shade(color, -.6)}" stroke-width=".6" opacity=".55"/>`);

    if (furry || mats.includes("wool") || mats.includes("suede") || mats.includes("denim")) ov.push(`<rect width="200" height="400" filter="url(#${id("n")})" opacity="${furry ? .3 : mats.includes("suede") ? .2 : .14}" style="mix-blend-mode:overlay"/>`);
    ov.push(`<rect width="200" height="400" fill="url(#${id("sh")})"/>`);
    if (mats.includes("cotton") || mats.includes("denim")) ov.push(`<rect width="200" height="400" fill="url(#${id("tw")})"/>`);
    if (furry) ov.push(`<rect width="200" height="400" fill="url(#${id("fu")})"/>`);
    if (mats.includes("suede")) ov.push(`<ellipse cx="84" cy="176" rx="22" ry="34" fill="url(#${id("su")})"/><ellipse cx="118" cy="226" rx="18" ry="28" fill="url(#${id("su")})"/><ellipse cx="62" cy="190" rx="8" ry="22" fill="url(#${id("su")})"/>`);
    const sheen = finish === "gloss" || mats.includes("eco") ? 1 : mats.includes("leather") ? .6 : (isPuffer || mats.includes("nylon")) ? .45 : 0;
    if (sheen) ov.push(`<rect width="200" height="400" fill="url(#${id("gl")})" opacity="${sheen}"/>`);
    if (pic && finish === "gloss") ov.push(`<rect width="200" height="400" fill="url(#${id("gl")})" transform="translate(52 0)" opacity=".7"/><ellipse cx="78" cy="150" rx="4" ry="9" fill="#fff" opacity=".6"/><ellipse cx="126" cy="200" rx="3" ry="7" fill="#fff" opacity=".45"/>`);
    if (!isCape && (mats.includes("leather") || mats.includes("eco") || mats.includes("suede"))) ov.push(`<path d="M${CX - 16},132 Q${CX - 14},180 ${CX - 16},${bottom} M${CX + 16},132 Q${CX + 14},180 ${CX + 16},${bottom}" stroke="${edge}" stroke-width=".9" fill="none"/>`);
    if (mats.includes("cotton")) ov.push(`<path d="M0,${bottom - 5} Q100,${bottom - 1} 200,${bottom - 5}" stroke="${detailC}" stroke-width=".7" stroke-dasharray="2 1.5" fill="none" opacity=".7"/>`);

    const tr = TYPE_RULES[st.type];
    if (tr) Object.keys(tr).forEach(f => tr[f].forEach(v => add(f, v, `Не бывает у типа «${lbl("type", st.type)}».`)));
    if (st.insul.includes("none")) ["m10", "m20"].forEach(v => add("temp", v, "Без утеплителя в мороз не будет тепло. Сначала убери «Без утеплителя»."));
    if (st.temp === "m10" || st.temp === "m20") add("insul", "none", `Для «${lbl("temp", st.temp)}» нужен утеплитель. Сначала поменяй температуру.`);
    if (st.texture === "check") NO_CHECK.forEach(v => add("material", v, "Клетки не бывает на коже и мехе. Сначала убери узор «В клетку»."));
    if (st.material.some(v => NO_CHECK.includes(v))) add("texture", "check", "Клетки не бывает на коже и мехе. Сначала убери этот материал.");
    if (st.finish === "gloss") NO_GLOSS.forEach(v => add("material", v, "Этот материал не бывает блестящим. Сначала выбери «Матовая»."));
    if (st.material.some(v => NO_GLOSS.includes(v))) add("finish", "gloss", "Шерсть, замша, хлопок, деним и мех не бывают блестящими.");
    if (st.hood === "no" && st.collar === "none") ["faux", "real"].forEach(v => add("fur", v, "Без капюшона и воротника мех некуда пришить. Сначала выбери капюшон или воротник."));
    if ((st.fur === "faux" || st.fur === "real") && st.hood === "no") add("collar", "none", "Мех нужен на воротнике, раз капюшона нет. Сначала убери мех.");
    if ((st.fur === "faux" || st.fur === "real") && st.collar === "none") add("hood", "no", "Мех нужен на капюшоне, раз воротника нет. Сначала убери мех.");
    if (st.closure && st.closure !== "zip") add("details", "twoZip", "Двусторонняя молния бывает только при застёжке на молнию.");
    if (st.details.includes("twoZip")) ["snap", "btn", "dbl", "wrap"].forEach(v => add("closure", v, "Выбрана двусторонняя молния. Сначала убери её в «Деталях»."));
    return m;
  }
  // Remove picked options that a newly chosen type rules out; returns their labels
  function sanitize() {
    const removed = [];
    for (let guard = 0; guard < 40; guard++) {
      const m = blockedMap(S);
      const hit = [...m.keys()].map(k => k.split(":")).find(([f, v]) => Array.isArray(S[f]) ? S[f].includes(v) : S[f] === v);
      if (!hit) break;
      const [f, v] = hit;
      if (Array.isArray(S[f])) S[f].splice(S[f].indexOf(v), 1); else S[f] = "";
      removed.push(lbl(f, v));
    }
    return removed;
  }

  const toast = document.getElementById("toast");
  const showToast = msg => { toast.textContent = msg; toast.hidden = false; clearTimeout(showToast.t); showToast.t = setTimeout(() => { toast.hidden = true; }, 4200); };

  function applyPreset(t) {
    const p = PRESETS[t]; if (!p) return;
    PRESET_KEYS.forEach(k => { if (!S.touched.includes(k)) S[k] = Array.isArray(p[k]) ? p[k].slice() : p[k]; });
  }
  form.addEventListener("click", e => {
    const btn = e.target.closest("button[data-v]"); if (!btn) return;
    const field = btn.parentElement.dataset.group, v = btn.dataset.v;
    const picked = Array.isArray(S[field]) ? S[field].includes(v) : S[field] === v;
    const why = blockedMap(S).get(field + ":" + v);
    if (why && !picked) { showToast(why); return; }
    if (picked && isAuto(field)) { S.touched.push(field); update(); return; }
    if (MULTI.has(field)) {
      const arr = S[field];
      if (picked) arr.splice(arr.indexOf(v), 1);
      else if (field === "size") {
        // at most two neighbouring sizes
        const keep = arr.filter(x => Math.abs(SIZE_ORDER.indexOf(x) - SIZE_ORDER.indexOf(v)) === 1).slice(-1);
        S.size = [...keep, v].sort((a, b) => SIZE_ORDER.indexOf(a) - SIZE_ORDER.indexOf(b));
      } else {
        // "no insulation" and "doesn't matter" exclude the other answers
        if ((field === "insul" && v === "none") || (field === "protect" && v === "any")) arr.length = 0;
        else if (field === "insul" || field === "protect") { const j = arr.indexOf(field === "insul" ? "none" : "any"); if (j >= 0) arr.splice(j, 1); }
        arr.push(v);
      }
    } else {
      S[field] = picked ? "" : v;
      if (field === "type" && S.type) {
        applyPreset(S.type);
        const removed = sanitize();
        if (removed.length) showToast(`Не сочетается с типом «${lbl("type", S.type)}», убрано: ${removed.join(", ").replace(/^./, c => c.toLowerCase())}.`);
      }
    }
    if (field !== "type" && !S.touched.includes(field)) S.touched.push(field);
    update();
  });
  form.addEventListener("input", e => { const k = e.target.dataset.text; if (k) { S[k] = e.target.value; update(true); } });

  function syncForm() {
    const blocked = blockedMap(S);
    form.querySelectorAll("[data-group]").forEach(g => {
      const val = S[g.dataset.group];
      g.querySelectorAll("button[data-v]").forEach(b => {
        const on = Array.isArray(val) ? val.includes(b.dataset.v) : val === b.dataset.v;
        b.setAttribute("aria-pressed", on ? "true" : "false");
        if (on && isAuto(g.dataset.group)) b.dataset.auto = "1"; else delete b.dataset.auto;
        const why = !on && blocked.get(g.dataset.group + ":" + b.dataset.v);
        if (why) { b.setAttribute("aria-disabled", "true"); b.title = why; } else { b.removeAttribute("aria-disabled"); b.removeAttribute("title"); }
      });
    });
    form.querySelectorAll("[data-text]").forEach(t => { if (document.activeElement !== t) t.value = S[t.dataset.text] || ""; });
  }

  // ---------- Summary ----------
  const lbl = (f, v) => (LABEL[f] && LABEL[f][v]) || v;
  const lc = t => t.replace(/^./, c => c.toLowerCase());
  const list = (f, arr) => arr.map(v => lbl(f, v).replace(/^./, c => c.toLowerCase())).join(", ");
  const isAuto = f => PRESET_KEYS.includes(f) && !S.touched.includes(f);
  function summaryLines() {
    const lines = [], autos = [];
    const add = (n, v, f) => { if (!v) return; if (f && isAuto(f)) autos.push(`${n.replace(/^./, c => c.toLowerCase())} ${v}`); else lines.push(`• ${n}: ${v}`); };
    const one = f => S[f] && lc(lbl(f, S[f]));
    add("Тип", S.type && lbl("type", S.type));
    add("Длина", one("length"), "length");
    add("Силуэт", one("fit"), "fit");
    add("Утеплитель", S.insul.includes("none") ? "нет" : list("insul", S.insul), "insul");
    add("Тёплая", one("temp"));
    add("Капюшон", S.hood && (S.hood === "no" ? "нет" : one("hood")), "hood");
    add("Мех", S.fur && (S.fur === "no" ? "нет" : one("fur")), "fur");
    add("Воротник", S.collar && (S.collar === "none" ? "нет" : one("collar")), "collar");
    add("Застёжка", one("closure"), "closure");
    add("Защита", list("protect", S.protect));
    add("Материал", list("material", S.material), "material");
    add("Цвета", list("colors", S.colors));
    add("Узор", one("texture"), "texture");
    add("Поверхность", one("finish"), "finish");
    add("Детали", list("details", S.details));
    add("Для чего", list("use", S.use));
    add("Размер", S.size.join(" или "));
    add("Обязательно", S.must.trim());
    add("Точно не хочу", S.nogo.trim());
    add("Бренды и ссылки", S.brands.trim());
    if (autos.length) lines.push(`• По умолчанию для этого типа (не меняла): ${autos.join("; ")}`);
    return lines;
  }
  const canLink = () => /^https?:$/.test(location.protocol) && window.self === window.top;
  const shareUrl = () => location.href.split("#")[0] + "#s=" + b64e(JSON.stringify(compact()));
  function summaryText(withLink) {
    const lines = summaryLines();
    let txt = "Моя идеальная куртка\n" + (lines.length ? lines.join("\n") : "Пока ничего не выбрано.");
    if (withLink && canLink() && lines.length) txt += "\n\nПосмотреть с рисунком: " + shareUrl();
    return txt;
  }

  const COUNTED = ["type", "length", "fit", "insul", "temp", "hood", "collar", "closure", "protect", "material", "colors", "details", "use", "size"];
  function updateStage() {
    document.getElementById("art").innerHTML = illustrate(S, "main", true);
    document.getElementById("kind").textContent = S.type ? lbl("type", S.type) : "Выбери тип куртки";
    const tags = [S.length && lbl("length", S.length), S.fit && lbl("fit", S.fit), S.temp && lbl("temp", S.temp),
      S.hood && S.hood !== "no" && "Капюшон", (S.fur === "faux" || S.fur === "real") && "С мехом", S.size.length && "Размер " + S.size.join("/")].filter(Boolean);
    document.getElementById("tags").innerHTML = tags.map(x => `<li>${esc(x)}</li>`).join("");
    document.getElementById("dots").innerHTML = S.colors.map(c => `<span style="background:${COLOR_HEX[c]}" title="${esc(lbl("colors", c))}"></span>`).join("");
    const done = COUNTED.filter(k => (Array.isArray(S[k]) ? S[k].length : S[k]) && !isAuto(k)).length;
    document.getElementById("meterText").textContent = `Отвечено ${done} из ${COUNTED.length}`;
    document.getElementById("meterBar").style.width = (100 * done / COUNTED.length) + "%";
  }
  function updateMini() {
    if (document.getElementById("mini").hidden) return;
    document.getElementById("miniArt").innerHTML = illustrate(S, "mini", false);
    document.getElementById("miniKind").textContent = document.getElementById("kind").textContent;
    document.getElementById("miniMeter").textContent = document.getElementById("meterText").textContent;
  }
  function update(textOnly) {
    if (!textOnly) { syncForm(); updateStage(); drawThumbs(); drawOptionPics(); updateMini(); }
    document.getElementById("summary").textContent = summaryText(false);
    save();
  }

  // ---------- Actions ----------
  const status = document.getElementById("status");
  const say = m => { status.textContent = m; clearTimeout(say.t); say.t = setTimeout(() => status.textContent = "", 5000); };
  const selectSummary = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("summary")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  function copy(text, ok) {
    const fail = () => { selectSummary(); say("Текст выделен, скопируй его вручную."); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => say(ok), fail); else fail();
  }
  document.getElementById("copyBtn").addEventListener("click", () => copy(summaryText(true), "Скопировано! Вставь в любой мессенджер."));
  document.getElementById("shareBtn").addEventListener("click", () => {
    if (navigator.share && canLink()) {
      navigator.share({ title: "Моя идеальная куртка", text: summaryText(false), url: shareUrl() })
        .catch(err => { if (err && err.name !== "AbortError") copy(summaryText(true), "Скопировано вместе со ссылкой. Вставь в мессенджер."); });
    } else copy(summaryText(true), canLink() ? "Скопировано вместе со ссылкой. Вставь в мессенджер." : "Скопировано! Вставь в любой мессенджер.");
  });
  const resetBtn = document.getElementById("resetBtn");
  resetBtn.addEventListener("click", () => {
    if (resetBtn.dataset.armed) {
      S = blank(); delete resetBtn.dataset.armed; resetBtn.textContent = "Начать заново";
      if (fromLink) { history.replaceState(null, "", location.href.split("#")[0]); fromLink = false; document.getElementById("sharedBanner").hidden = true; }
      update(); say("Все ответы сброшены.");
    } else {
      resetBtn.dataset.armed = "1"; resetBtn.textContent = "Точно сбросить?";
      setTimeout(() => { delete resetBtn.dataset.armed; resetBtn.textContent = "Начать заново"; }, 3500);
    }
  });

  // Phones: the big drawing scrolls away with the header and a slim bar takes over
  const stageEl = document.querySelector(".stage"), mini = document.getElementById("mini");
  const phone = window.matchMedia("(max-width: 879px)");
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([en]) => {
      const show = phone.matches && !en.isIntersecting && en.boundingClientRect.top < 0;
      if (mini.hidden === !show) return;
      mini.hidden = !show; updateMini();
    }).observe(stageEl);
  }
  document.querySelectorAll("[data-done]").forEach(b => b.addEventListener("click", () =>
    document.querySelector(".result").scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" })));

  sanitize();
  update();
})();
</script>
</body>
</html>
